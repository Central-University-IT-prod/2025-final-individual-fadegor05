[project]
name = "fadegor05-final-prod"
version = "0.1.0"
description = "Чем гуще лес, тем шкибиди доп доп ес ес"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "aiogram-dialog>=2.3.1",
    "aiohttp>=3.11.12",
    "alembic>=1.14.1",
    "asyncpg>=0.30.0",
    "boto3>=1.36.23",
    "dishka>=1.4.2",
    "fastapi>=0.115.8",
    "greenlet>=3.1.1",
    "gunicorn>=23.0.0",
    "pydantic-settings>=2.7.1",
    "python-multipart>=0.0.20",
    "redis>=5.2.1",
    "sqlmodel>=0.0.22",
    "tavern>=2.11.0",
    "uvicorn>=0.34.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

